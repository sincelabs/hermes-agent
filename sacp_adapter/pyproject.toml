[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sacp-hermes-adapter"
version = "0.1.0"
description = "SACP adapter for Hermes agents"
dependencies = [
    "httpx>=0.23.0",
    "websockets>=10.0",
]

[project.scripts]
sacp-hermes-adapter = "sacp_adapter.__main__:main"